name: Build waleed remix (APK + AAB)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PROJECT_DIR: .
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 1.0.${{ github.run_number }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Locate or Unzip project files
        run: |
          if [ -f settings.gradle.kts ] || [ -f settings.gradle ]; then 
            echo "Project found in repo root"
            echo "PROJECT_DIR=." >> $GITHUB_ENV
          else 
            ZIP=$(ls -1 *.zip 2>/dev/null | head -n 1)
            if [ -z "$ZIP" ]; then
              echo "::error::No zip found"
              exit 1
            fi
            rm -rf _src && mkdir -p _src && unzip -q -o "$ZIP" -d _src
            FOUND=$(find _src -name "settings.gradle.kts" -o -name "settings.gradle" | head -n 1)
            if [ -z "$FOUND" ]; then
              echo "::error::settings.gradle not found"
              exit 1
            fi
            DIR_NAME=$(dirname "$FOUND")
            echo "PROJECT_DIR=$DIR_NAME" >> $GITHUB_ENV
            echo "Found project at: $DIR_NAME"
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android SDK components
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDKM" ]; then
            yes | "$SDKM" --licenses > /dev/null 2>&1 || true
            "$SDKM" "platforms;android-35" "build-tools;35.0.0" > /dev/null || true
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Grant execute permission for gradlew
        run: |
          find . -name "gradlew" -exec chmod +x {} +

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret KEYSTORE_BASE64 is missing"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> $GITHUB_ENV

      - name: Build signed APK and AAB
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace --warning-mode=summary \
            -PversionCode=${{ env.VERSION_CODE }} \
            -PversionName=${{ env.VERSION_NAME }} \
            assembleRelease bundleRelease 2>&1 | tee build.log

      - name: Show build errors
        if: failure()
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          grep -E "^e: |error:|FAILED|What went wrong|Execution failed|Could not resolve" -A4 build.log | head -n 120 || true

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: ${{ env.PROJECT_DIR }}/build.log

      - name: Collect outputs
        run: |
          mkdir -p dist
          APK_FILE=$(find . -path "*/build/outputs/apk/release/*.apk" | head -n 1)
          AAB_FILE=$(find . -path "*/build/outputs/bundle/release/*.aab" | head -n 1)
          
          if [ -n "$APK_FILE" ]; then
            cp "$APK_FILE" "dist/waleed-remix-${{ env.VERSION_NAME }}.apk"
          fi
          if [ -n "$AAB_FILE" ]; then
            cp "$AAB_FILE" "dist/waleed-remix-${{ env.VERSION_NAME }}.aab"
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: waleed-remix-apk-${{ env.VERSION_NAME }}
          path: dist/*.apk

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: waleed-remix-aab-${{ env.VERSION_NAME }}
          path: dist/*.aab

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_NAME }}
          name: waleed remix ${{ env.VERSION_NAME }}
          files: |
            dist/*.apk
            dist/*.aab
